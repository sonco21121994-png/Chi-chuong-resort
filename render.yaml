# Free web disk is wiped on every deploy. Accounts live in Postgres (chi-chuong-db,
# Singapore, free — expires 30 days after creation) via DATABASE_URL.
# The server still uses a local SQLite file and mirrors it to Postgres on each write.
databases:
  - name: chi-chuong-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: chi-chuong-resort
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chi-chuong-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_URL
        sync: false
