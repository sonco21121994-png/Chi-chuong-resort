# Free web services have an ephemeral disk: server/data/daongoc.db (accounts) is wiped
# on every deploy, restart, and spin-down. A persistent disk requires a paid instance.
# After upgrading, add disk.mountPath /var/data and env DB=/var/data/daongoc.db.
services:
  - type: web
    name: chi-chuong-resort
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_URL
        sync: false
